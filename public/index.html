<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · A11yRank Mini</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="dashboard">
  <div class="app-layout">
    <div id="app-header"></div>
    <main id="main-content" class="app-main page-enter" tabindex="-1">
      <div class="alert alert-warning mb-6" role="alert">
        <span class="alert-icon" aria-hidden="true">⚠️</span>
        <div><strong>Entorno de laboratorio, vulnerable a propósito.</strong> No usar con datos reales.</div>
      </div>

      <div class="page-header">
        <div class="page-header-left">
          <p class="page-eyebrow">Panel de control</p>
          <h1 class="page-title" id="saludo">Dashboard</h1>
          <p class="page-subtitle">Estado de accesibilidad de tus dominios</p>
        </div>
        <div class="page-header-right">
          <button type="button" class="btn btn-primary" id="nueva-btn"><span aria-hidden="true">+</span> Nueva auditoría</button>
        </div>
      </div>

      <div id="audit-err"></div>
      <div id="en-curso" role="status" aria-live="polite"></div>

      <div class="stats-grid" id="stats" aria-label="Resumen de auditorías"></div>

      <div class="card card-flat">
        <div class="flex items-center justify-between mb-4" style="padding-bottom:1rem;border-bottom:1px solid var(--color-border)">
          <h2 style="font-size:1.0625rem;font-weight:700;margin:0">Mis auditorías</h2>
          <span id="conteo" style="font-size:.8125rem;color:var(--color-text-muted)"></span>
        </div>
        <div class="filter-toolbar" id="filtros" role="search" aria-label="Filtrar auditorías" hidden>
          <div class="filter-search">
            <span class="filter-search-icon" aria-hidden="true">🔍</span>
            <input type="search" class="input-field" id="busqueda" placeholder="Buscar por dominio…" aria-label="Buscar auditorías por dominio">
          </div>
          <div class="chip-group" role="group" aria-label="Filtrar por estado">
            <button type="button" class="chip" data-filtro="TODAS" aria-pressed="true">Todas <span class="chip-count">0</span></button>
            <button type="button" class="chip" data-filtro="COMPLETADO" aria-pressed="false">Completadas <span class="chip-count">0</span></button>
            <button type="button" class="chip" data-filtro="EN_PROCESO" aria-pressed="false">En curso <span class="chip-count">0</span></button>
            <button type="button" class="chip" data-filtro="FALLIDO" aria-pressed="false">Fallidas <span class="chip-count">0</span></button>
          </div>
        </div>
        <div id="audits"><div class="flex justify-center py-8"><span class="spinner spinner-lg"></span></div></div>
      </div>
    </main>
  </div>

  <dialog class="modal-panel" id="nueva-modal" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title" style="font-size:1.0625rem;font-weight:700;margin:0">Nueva auditoría</h2>
      <button type="button" class="modal-close-btn" data-cerrar aria-label="Cerrar modal">×</button>
    </div>
    <form id="audit-form" novalidate>
      <div class="modal-body">
        <div id="audit-form-err"></div>
        <div class="input-group" style="margin-bottom:0">
          <label class="input-label" for="url">URL del dominio</label>
          <input class="input-field" id="url" name="url" type="url" required placeholder="https://ejemplo.com" aria-describedby="url-hint">
          <p class="input-hint" id="url-hint">Podés escribir solo el dominio, por ejemplo ejemplo.com</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="audit-enviar">Iniciar auditoría</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
