<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard · A11yRank Mini</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="leaderboard">
  <div id="app-header"></div>
  <main id="main-content" class="app-main page-enter" style="max-width:1000px" tabindex="-1">
    <div style="text-align:center;margin-bottom:2.5rem">
      <div class="badge badge-primary" style="margin-bottom:1rem;text-transform:uppercase;letter-spacing:.06em">🏆 Ranking público</div>
      <h1 style="font-size:2rem;font-weight:800;color:var(--color-navy);letter-spacing:-.025em;margin-bottom:.75rem">Leaderboard de accesibilidad</h1>
      <p style="font-size:1rem;color:var(--color-text-muted);max-width:560px;margin:0 auto">Ranking de dominios cuyos dueños eligieron hacer público su puntaje.</p>
    </div>
    <div id="resumen"></div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="tabla"><div class="flex justify-center py-8"><span class="spinner spinner-lg"></span></div></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
